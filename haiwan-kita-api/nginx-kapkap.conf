server {
    listen 80;
    server_name kapkap.me www.kapkap.me;

    return 301 https://$host$request_uri;
    include /opt/ssl-manager/web_server_includes/nginx_well_known_service_template.conf;
}

server {
    listen 443 ssl;
    server_name kapkap.me www.kapkap.me;
    root /var/www/kapkap;

    index index.html index.php;

    ssl_certificate /etc/nginx/ssl/kapkap.me-chain.crt;
    ssl_certificate_key /etc/nginx/ssl/kapkap.me.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static frontend
    location / {
        try_files $uri $uri/ =404;
    }

    # Auth routes (/auth/login, /auth/register, /auth/me, etc.)
    location /auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes (/api/v1/missions, /api/v1/location, /api/v1/users)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # Socket.io (WebSocket + polling for real-time GPS)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # phpMyAdmin
    location /phpmyadmin/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
